# Entorno de PRODUCCION. Usa build real (no recarga en vivo) y Caddy con HTTPS.
# Levantar:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Solo Caddy expone puertos al host (80/443). API y base de datos quedan en la
# red interna, no accesibles directamente desde fuera.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      # Atado a 127.0.0.1: la app NO se expone al internet directamente; solo el
      # Caddy del host (mismo servidor) la alcanza y publica con HTTPS por el
      # dominio. Asi no se puede entrar por http://IP:8090 en texto plano.
      - '127.0.0.1:${HTTP_PORT:-8090}:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
